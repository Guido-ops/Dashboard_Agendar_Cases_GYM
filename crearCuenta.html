<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta - GYM los Cauros</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>

    <nav class = "navbar">
        <div class="tituloNav">
            GYM Los Cauros
        </div>

        <div class = "menu">
            <a href="index.html">Inicio</a>
            <a href="login.html">Iniciar Sesion</a>
        </div>     
    </nav>



    <div class = "FormularioContenedor">
        <form class="formulariostyle" id="CrearCuenta">
                <h1 class ="titulo">Crear Usuario</h1>
                <hr style =" margin-bottom: 10px;">
            
            <div class="fila">
                <div class="campo">
                    <label for="nombreI"> Nombre </label>
                    <input type="text" id="nombreI" placeholder="Antonio">
                </div>

                <div class="campo">
                    <label for="apellidoI"> Apellido </label>
                    <input type="text" id="apellidoI" placeholder="Santibáñez">
                </div>

                <div class = "campo">
                    <label for="Password"> Contraseña </label>
                    <input type="password" id="Password" placeholder="********">
                </div>
                
                <div class = "campo" > 
                    <label for="ConfPassword"> Confirmar Contraseña </label>
                    <input type="password" id="ConfPassword" placeholder="********">
                </div>        
            </div>

            <div class="fila">
                <div class="campo">
                    <label for="correoI">Correo</label>
                    <input type="text" id="correoI" placeholder="antonio@exemple.cl">
                </div>

                <div class="campo">
                    <label for="paisSelect">Pais</label>
                    <select id="paisSelect">
                        <option Value="">Seleccione un pais</option>
                        <option value="CL">Chile</option>
                        <option value="MX">México</option>
                        <option value="US">Estados Unidos</option>
                        <option value="ES">España</option>
                        <option value="AR">Argentina</option>
                        <option value="CA">Canada</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="telefonoI">Telefono</label>
                    <input type="text" id="telefonoI" placeholder="9 12345678">
                
                </div>

                <div class="campo">
                    <label for="direccionI">Direccion</label>
                    <input type="text" id="direccionI" placeholder="Calle 123"  >
                </div>

            </div>
        
            <div class="botones">
                <button class="guardarBtn"type="submit" >Guardar</button>
                <button class="limpiarBtn" type="reset">Limpiar</button>

            </div>

            <span class="enlace">
                Si tienes cuenta <a href="login.html"> Iniciar Sesion</a>
            </span>
        </form>
    </div>
    <script src="funcionalidades.js"></script>
</body>
</html>
